apiVersion: batch/v1
kind: Job
metadata:
  name: payment-db-rs-init
  namespace: inno
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rs-init
          image: mongo:7
          command:
            - bash
            - -c
            - |
              until mongosh --host payment-db --eval "db.adminCommand('ping')"; do
                echo waiting for mongo to accept connections;
                sleep 3;
              done
              mongosh --host payment-db --eval '
                try {
                  rs.status();
                  print("replica set already initialized");
                } catch (e) {
                  rs.initiate({
                    _id: "rs0",
                    members: [{ _id: 0, host: "payment-db:27017" }]
                  });
                  print("replica set initiated");
                }
              '